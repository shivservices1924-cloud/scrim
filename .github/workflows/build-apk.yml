name: Build RushX Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Release RushX Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/rushx.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RushX-Android-APK
          path: output/rushx.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "RushX Esports Mobile App v1.0.0"
          body: |
            ### 🎮 RushX Free Fire Esports Official Mobile APK
            - Compatible with Android 8.0 to Android 15
            - Instant Room ID & Password integration
            - Real Cash Tournaments on Bermuda map
            - Minimum deposit ₹50, Minimum withdrawal ₹100
          files: output/rushx.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
