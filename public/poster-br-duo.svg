<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="bgGlowDuo" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1f2514" />
      <stop offset="45%" stop-color="#121820" />
      <stop offset="100%" stop-color="#06090e" />
    </radialGradient>
    <linearGradient id="goldDuo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8" />
      <stop offset="30%" stop-color="#F5C400" />
      <stop offset="70%" stop-color="#E59400" />
      <stop offset="100%" stop-color="#996000" />
    </linearGradient>
    <linearGradient id="cyberDuo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(245, 196, 0, 0.25)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.88)" />
    </linearGradient>
    <filter id="duoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="800" height="500" fill="url(#bgGlowDuo)" />

  <!-- Diagonal Cyber Grid Lines -->
  <g opacity="0.12" stroke="#F5C400" stroke-width="1.5">
    <line x1="0" y1="80" x2="800" y2="420" />
    <line x1="0" y1="220" x2="800" y2="560" />
    <line x1="800" y1="80" x2="0" y2="420" />
    <line x1="800" y1="220" x2="0" y2="560" />
  </g>

  <!-- Outer Card Accent Border -->
  <rect x="8" y="8" width="784" height="484" rx="16" fill="none" stroke="url(#goldDuo)" stroke-width="2.5" opacity="0.6" />

  <!-- Central Duo Warriors Crest -->
  <g transform="translate(400, 210)" filter="url(#duoGlow)">
    <!-- Base Shield -->
    <path d="M-130 -80 L130 -80 L100 70 L0 120 L-100 70 Z" fill="#0f141f" stroke="url(#goldDuo)" stroke-width="3.5" />
    <circle cx="0" cy="10" r="110" fill="none" stroke="#F5C400" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4" />

    <!-- Left Warrior Mask (Player 1) -->
    <g transform="translate(-45, 0)">
      <circle cx="0" cy="-35" r="28" fill="#141a26" stroke="url(#goldDuo)" stroke-width="2.5" />
      <polygon points="-20,-35 0,-50 20,-35 12,-15 -12,-15" fill="url(#goldDuo)" />
      <path d="M-22 -15 L22 -15 L18 20 L0 32 L-18 20 Z" fill="#0b0e14" stroke="url(#goldDuo)" stroke-width="2" />
      <line x1="-14" y1="-5" x2="14" y2="-5" stroke="#FFFFFF" stroke-width="2" />
    </g>

    <!-- Right Warrior Mask (Player 2) -->
    <g transform="translate(45, 0)">
      <circle cx="0" cy="-35" r="28" fill="#141a26" stroke="url(#goldDuo)" stroke-width="2.5" />
      <polygon points="-20,-35 0,-50 20,-35 12,-15 -12,-15" fill="url(#goldDuo)" />
      <path d="M-22 -15 L22 -15 L18 20 L0 32 L-18 20 Z" fill="#0b0e14" stroke="url(#goldDuo)" stroke-width="2" />
      <line x1="-14" y1="-5" x2="14" y2="-5" stroke="#FFFFFF" stroke-width="2" />
    </g>

    <!-- Central Gold Swords Emblem -->
    <g transform="translate(0, 15)">
      <polygon points="-3,-55 3,-55 3,35 -3,35" fill="url(#goldDuo)" transform="rotate(45)" />
      <polygon points="-3,-55 3,-55 3,35 -3,35" fill="url(#goldDuo)" transform="rotate(-45)" />
      <circle cx="0" cy="0" r="16" fill="#0b0e14" stroke="url(#goldDuo)" stroke-width="3" />
      <text x="0" y="5" fill="#F5C400" font-family="'Rajdhani', sans-serif" font-weight="900" font-size="14" text-anchor="middle">2X</text>
    </g>
  </g>

  <!-- Top Badges -->
  <g transform="translate(30, 42)">
    <rect width="180" height="32" rx="8" fill="#121620" stroke="url(#goldDuo)" stroke-width="1.5" />
    <text x="90" y="21" fill="#F5C400" font-family="'Rajdhani', sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="2">
      BERMUDA MAP
    </text>
  </g>

  <g transform="translate(590, 42)">
    <rect width="180" height="32" rx="8" fill="#F5C400" />
    <text x="90" y="21" fill="#000000" font-family="'Rajdhani', sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="2">
      DUO TEAM BATTLE
    </text>
  </g>

  <!-- Bottom Dark Gradient Overlay for Typography -->
  <rect x="10" y="310" width="780" height="180" rx="14" fill="url(#cyberDuo)" />

  <!-- Typography -->
  <text x="400" y="390"
        font-family="'Rajdhani', 'Impact', sans-serif"
        font-weight="900"
        font-size="52"
        fill="#FFFFFF"
        text-anchor="middle"
        letter-spacing="4">
    DUO BATTLE ROYALE
  </text>

  <text x="400" y="435"
        font-family="'Inter', sans-serif"
        font-weight="800"
        font-size="15"
        fill="#F5C400"
        text-anchor="middle"
        letter-spacing="6">
    TEAM COORDINATION • 2 PLAYERS • CASH PRIZE
  </text>
</svg>
