<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="bgGlowCs" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a0f12" />
      <stop offset="45%" stop-color="#14101a" />
      <stop offset="100%" stop-color="#07070c" />
    </radialGradient>
    <linearGradient id="goldCs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A8" />
      <stop offset="30%" stop-color="#F5C400" />
      <stop offset="70%" stop-color="#E53E3E" />
      <stop offset="100%" stop-color="#9B1C1C" />
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="cyberCs" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(239, 68, 68, 0.25)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.9)" />
    </linearGradient>
    <filter id="csGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGlowCs)" />

  <!-- Tactical Grid -->
  <g opacity="0.12" stroke="#EF4444" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Radial Target Reticle -->
  <circle cx="400" cy="210" r="160" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.35" />
  <circle cx="400" cy="210" r="100" fill="none" stroke="#F5C400" stroke-width="2" opacity="0.45" />
  <circle cx="400" cy="210" r="40" fill="none" stroke="#EF4444" stroke-width="2" opacity="0.6" />
  <line x1="400" y1="40" x2="400" y2="380" stroke="#EF4444" stroke-width="1" opacity="0.3" stroke-dasharray="4 4" />
  <line x1="230" y1="210" x2="570" y2="210" stroke="#EF4444" stroke-width="1" opacity="0.3" stroke-dasharray="4 4" />

  <!-- Dual Crosshair Combat Icon -->
  <g transform="translate(400, 200) scale(1.1)" filter="url(#csGlow)">
    <!-- Shield / Crest Background -->
    <polygon points="0,-95 65,-40 50,65 0,95 -50,65 -65,-40" fill="#120608" stroke="url(#redAccent)" stroke-width="3" opacity="0.9" />
    <!-- Crossed Sniper Rifles / Sabers -->
    <path d="M-55,-55 L55,55" stroke="#F5C400" stroke-width="6" stroke-linecap="round" />
    <path d="M55,-55 L-55,55" stroke="#F5C400" stroke-width="6" stroke-linecap="round" />
    <circle cx="0" cy="0" r="28" fill="#1A0505" stroke="#EF4444" stroke-width="4" />
    <circle cx="0" cy="0" r="8" fill="#EF4444" />
    <!-- Skull / Headshot Emblem -->
    <path d="M-12,-16 Q0,-24 12,-16 Q18,-4 14,8 L-14,8 Q-18,-4 -12,-16 Z" fill="#FFF" opacity="0.9" />
    <circle cx="-5" cy="-8" r="2.5" fill="#1A0505" />
    <circle cx="5" cy="-8" r="2.5" fill="#1A0505" />
    <rect x="-6" y="8" width="12" height="6" rx="2" fill="#FFF" opacity="0.9" />
  </g>

  <!-- Cyber Overlay Gradient -->
  <rect y="260" width="800" height="240" fill="url(#cyberCs)" />

  <!-- Mode Badge -->
  <g transform="translate(400, 320)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#1E0A0C" stroke="#EF4444" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" font-family="'Rajdhani', 'Impact', sans-serif" font-weight="800" font-size="12" fill="#EF4444" letter-spacing="3">
      1V1 &amp; 4V4 CLASH
    </text>
  </g>

  <!-- Title Text -->
  <text x="400" y="380" text-anchor="middle" font-family="'Rajdhani', 'Impact', sans-serif" font-weight="900" font-size="44" font-style="italic" fill="url(#goldCs)" letter-spacing="4">
    CLASH SQUAD
  </text>
  <text x="400" y="415" text-anchor="middle" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="15" fill="#FDA4AF" letter-spacing="5">
    FAST PACED • HEADSHOT ONLY • INSTANT CASHOUT
  </text>

  <!-- RushX Esports Watermark -->
  <text x="400" y="465" text-anchor="middle" font-family="'Rajdhani', sans-serif" font-weight="800" font-size="13" fill="#F5C400" opacity="0.85" letter-spacing="4">
    RUSHX ESPORTS TOURNAMENT
  </text>
</svg>
