<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="bgGlowWolf" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#241b08" />
      <stop offset="45%" stop-color="#121620" />
      <stop offset="100%" stop-color="#06090e" />
    </radialGradient>
    <linearGradient id="goldWolf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8" />
      <stop offset="30%" stop-color="#F5C400" />
      <stop offset="70%" stop-color="#E59400" />
      <stop offset="100%" stop-color="#8C5C00" />
    </linearGradient>
    <linearGradient id="cyanWolf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#F5C400" />
    </linearGradient>
    <linearGradient id="cyberWolf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(245, 196, 0, 0.25)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.9)" />
    </linearGradient>
    <filter id="wolfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGlowWolf)" />

  <!-- Cyber Grid -->
  <g opacity="0.1" stroke="#F5C400" stroke-width="1">
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="260" x2="800" y2="260" />
    <line x1="0" y1="390" x2="800" y2="390" />
    <line x1="180" y1="0" x2="180" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="620" y1="0" x2="620" y2="500" />
  </g>

  <!-- Hexagonal Arena Framing -->
  <polygon points="400,60 520,130 520,270 400,340 280,270 280,130" fill="none" stroke="#F5C400" stroke-width="2" opacity="0.4" stroke-dasharray="10 6" />
  <polygon points="400,75 505,138 505,262 400,325 295,262 295,138" fill="#0C101A" opacity="0.6" stroke="url(#cyanWolf)" stroke-width="1.5" />

  <!-- Lone Wolf Emblem -->
  <g transform="translate(400, 200)" filter="url(#wolfGlow)">
    <!-- Wolf Crest Silhouette -->
    <!-- Ears -->
    <polygon points="-40,-75 -20,-30 -50,-20" fill="url(#goldWolf)" />
    <polygon points="40,-75 20,-30 50,-20" fill="url(#goldWolf)" />
    <!-- Outer Face -->
    <polygon points="0,-35 -35,-20 -45,15 -25,45 0,70 25,45 45,15 35,-20" fill="#141924" stroke="url(#goldWolf)" stroke-width="3" />
    <!-- Cheeks & Snout -->
    <polygon points="0,-10 -25,5 -15,35 0,55 15,35 25,5" fill="#1F2636" />
    <polygon points="0,20 -10,32 0,42 10,32" fill="#F5C400" />
    <!-- Glowing Eyes -->
    <polygon points="-22,-5 -10,-8 -16,2" fill="#38BDF8" />
    <polygon points="22,-5 10,-8 16,2" fill="#38BDF8" />
    <circle cx="-16" cy="-2" r="1.5" fill="#FFF" />
    <circle cx="16" cy="-2" r="1.5" fill="#FFF" />
    <!-- Crown atop Wolf Head -->
    <path d="M-22,-45 L-12,-35 L0,-50 L12,-35 L22,-45 L15,-28 L-15,-28 Z" fill="url(#goldWolf)" stroke="#8C5C00" stroke-width="1" />
  </g>

  <!-- Cyber Overlay Gradient -->
  <rect y="260" width="800" height="240" fill="url(#cyberWolf)" />

  <!-- Mode Badge -->
  <g transform="translate(400, 320)">
    <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#161B26" stroke="#F5C400" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" font-family="'Rajdhani', 'Impact', sans-serif" font-weight="800" font-size="12" fill="#F5C400" letter-spacing="3">
      1V1 SOLO DUEL
    </text>
  </g>

  <!-- Title Text -->
  <text x="400" y="380" text-anchor="middle" font-family="'Rajdhani', 'Impact', sans-serif" font-weight="900" font-size="44" font-style="italic" fill="url(#goldWolf)" letter-spacing="4">
    LONE WOLF 1V1
  </text>
  <text x="400" y="415" text-anchor="middle" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="15" fill="#E2E8F0" letter-spacing="5">
    IRON CAGE • ZERO THIRD-PARTY • ULTIMATE AIM
  </text>

  <!-- RushX Esports Watermark -->
  <text x="400" y="465" text-anchor="middle" font-family="'Rajdhani', sans-serif" font-weight="800" font-size="13" fill="#F5C400" opacity="0.85" letter-spacing="4">
    RUSHX ESPORTS TOURNAMENT
  </text>
</svg>
