<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="bgGlowSquad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#14251e" />
      <stop offset="45%" stop-color="#101824" />
      <stop offset="100%" stop-color="#06080d" />
    </radialGradient>
    <linearGradient id="goldSquad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A8" />
      <stop offset="30%" stop-color="#F5C400" />
      <stop offset="70%" stop-color="#DE9000" />
      <stop offset="100%" stop-color="#805300" />
    </linearGradient>
    <linearGradient id="cyberSquad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(245, 196, 0, 0.25)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.9)" />
    </linearGradient>
    <filter id="squadGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="800" height="500" fill="url(#bgGlowSquad)" />

  <!-- Diagonal Cyber Grid Lines -->
  <g opacity="0.12" stroke="#F5C400" stroke-width="1.5">
    <line x1="0" y1="50" x2="800" y2="400" />
    <line x1="0" y1="180" x2="800" y2="530" />
    <line x1="800" y1="50" x2="0" y2="400" />
    <line x1="800" y1="180" x2="0" y2="530" />
  </g>

  <!-- Outer Card Accent Border -->
  <rect x="8" y="8" width="784" height="484" rx="16" fill="none" stroke="url(#goldSquad)" stroke-width="2.5" opacity="0.6" />

  <!-- Central Squad 4-Player Crest -->
  <g transform="translate(400, 205)" filter="url(#squadGlow)">
    <path d="M-150 -90 L150 -90 L120 75 L0 130 L-120 75 Z" fill="#0f1624" stroke="url(#goldSquad)" stroke-width="3.5" />
    <circle cx="0" cy="15" r="120" fill="none" stroke="#F5C400" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4" />

    <!-- 4-Player Shields / Emblems -->
    <g transform="translate(0, -35)">
      <!-- Top Captain -->
      <path d="M-28 -40 L0 -65 L28 -40 L22 -10 L0 5 L-22 -10 Z" fill="url(#goldSquad)" />
      <circle cx="0" cy="-68" r="4.5" fill="#FFFFFF" />
      <circle cx="0" cy="-28" r="10" fill="#0b0e14" />
    </g>

    <!-- Flank Left (Player 2) -->
    <g transform="translate(-70, 0)">
      <path d="M-22 -20 L0 -40 L22 -20 L18 10 L0 25 L-18 10 Z" fill="#141c2c" stroke="url(#goldSquad)" stroke-width="2" />
      <polygon points="0,-25 10,-10 0,5 -10,-10" fill="url(#goldSquad)" opacity="0.8" />
    </g>

    <!-- Flank Right (Player 3) -->
    <g transform="translate(70, 0)">
      <path d="M-22 -20 L0 -40 L22 -20 L18 10 L0 25 L-18 10 Z" fill="#141c2c" stroke="url(#goldSquad)" stroke-width="2" />
      <polygon points="0,-25 10,-10 0,5 -10,-10" fill="url(#goldSquad)" opacity="0.8" />
    </g>

    <!-- Center Anchor (Player 4) -->
    <g transform="translate(0, 30)">
      <circle cx="0" cy="0" r="28" fill="#0b0e14" stroke="url(#goldSquad)" stroke-width="3" />
      <text x="0" y="8" fill="#F5C400" font-family="'Rajdhani', sans-serif" font-weight="900" font-size="22" text-anchor="middle">4V4</text>
    </g>
  </g>

  <!-- Top Badges -->
  <g transform="translate(30, 42)">
    <rect width="180" height="32" rx="8" fill="#121620" stroke="url(#goldSquad)" stroke-width="1.5" />
    <text x="90" y="21" fill="#F5C400" font-family="'Rajdhani', sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="2">
      BERMUDA MAP
    </text>
  </g>

  <g transform="translate(590, 42)">
    <rect width="180" height="32" rx="8" fill="#F5C400" />
    <text x="90" y="21" fill="#000000" font-family="'Rajdhani', sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="2">
      4-PLAYER SQUAD
    </text>
  </g>

  <!-- Bottom Dark Gradient Overlay for Typography -->
  <rect x="10" y="310" width="780" height="180" rx="14" fill="url(#cyberSquad)" />

  <!-- Typography -->
  <text x="400" y="390"
        font-family="'Rajdhani', 'Impact', sans-serif"
        font-weight="900"
        font-size="52"
        fill="#FFFFFF"
        text-anchor="middle"
        letter-spacing="4">
    SQUAD BATTLE ROYALE
  </text>

  <text x="400" y="435"
        font-family="'Inter', sans-serif"
        font-weight="800"
        font-size="15"
        fill="#F5C400"
        text-anchor="middle"
        letter-spacing="6">
    4 PLAYERS • GRAND PRIZE POOL • FULL MAP WAR
  </text>
</svg>

