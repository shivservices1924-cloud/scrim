<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="bgGlowSolo" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#241c08" />
      <stop offset="45%" stop-color="#121620" />
      <stop offset="100%" stop-color="#07090e" />
    </radialGradient>
    <linearGradient id="goldSolo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF099" />
      <stop offset="30%" stop-color="#F5C400" />
      <stop offset="70%" stop-color="#D99B00" />
      <stop offset="100%" stop-color="#8C6200" />
    </linearGradient>
    <linearGradient id="cyberSolo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(245, 196, 0, 0.25)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.85)" />
    </linearGradient>
    <filter id="soloGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="800" height="500" fill="url(#bgGlowSolo)" />

  <!-- Diagonal Cyber Grid Lines -->
  <g opacity="0.12" stroke="#F5C400" stroke-width="1.5">
    <line x1="0" y1="100" x2="800" y2="450" />
    <line x1="0" y1="200" x2="800" y2="550" />
    <line x1="0" y1="0" x2="800" y2="350" />
    <line x1="200" y1="0" x2="0" y2="200" />
    <line x1="450" y1="0" x2="0" y2="450" />
    <line x1="700" y1="0" x2="200" y2="500" />
  </g>

  <!-- Outer Card Accent Border -->
  <rect x="8" y="8" width="784" height="484" rx="16" fill="none" stroke="url(#goldSolo)" stroke-width="2.5" opacity="0.6" />

  <!-- Central Solo Hero Emblem -->
  <g transform="translate(400, 210)" filter="url(#soloGlow)">
    <!-- Aura Ring -->
    <circle cx="0" cy="0" r="125" fill="#141924" stroke="url(#goldSolo)" stroke-width="4" opacity="0.9" />
    <circle cx="0" cy="0" r="140" fill="none" stroke="#F5C400" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />

    <!-- Imperial Solo Crown -->
    <path d="M-55 -40 L-45 -85 L-18 -55 L0 -95 L18 -55 L45 -85 L55 -40 Z" fill="url(#goldSolo)" />
    <circle cx="-45" cy="-88" r="4.5" fill="#FFFFFF" />
    <circle cx="0" cy="-98" r="5.5" fill="#FFFFFF" />
    <circle cx="45" cy="-88" r="4.5" fill="#FFFFFF" />

    <!-- Solo Warrior Shield & Visor Mask -->
    <path d="M-60 -25 L60 -25 L45 55 L0 85 L-45 55 Z" fill="#0b0e14" stroke="url(#goldSolo)" stroke-width="3" />
    <polygon points="-35,5 -15,-5 15,-5 35,5 25,25 0,35 -25,25" fill="url(#goldSolo)" opacity="0.95" />
    <line x1="-30" y1="8" x2="30" y2="8" stroke="#000000" stroke-width="2.5" />

    <!-- Crosshair Sights -->
    <circle cx="0" cy="10" r="28" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4" />
    <line x1="-36" y1="10" x2="36" y2="10" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4" />
    <line x1="0" y1="-26" x2="0" y2="46" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- Top Badges -->
  <g transform="translate(30, 42)">
    <rect width="180" height="32" rx="8" fill="#121620" stroke="url(#goldSolo)" stroke-width="1.5" />
    <text x="90" y="21" fill="#F5C400" font-family="'Rajdhani', sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="2">
      BERMUDA MAP
    </text>
  </g>

  <g transform="translate(610, 42)">
    <rect width="160" height="32" rx="8" fill="#F5C400" />
    <text x="80" y="21" fill="#000000" font-family="'Rajdhani', sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="2">
      1 VS 47 • SOLO
    </text>
  </g>

  <!-- Bottom Dark Gradient Overlay for Typography -->
  <rect x="10" y="310" width="780" height="180" rx="14" fill="url(#cyberSolo)" />

  <!-- Typography -->
  <text x="400" y="390"
        font-family="'Rajdhani', 'Impact', sans-serif"
        font-weight="900"
        font-size="52"
        fill="#FFFFFF"
        text-anchor="middle"
        letter-spacing="4">
    SOLO BATTLE ROYALE
  </text>

  <text x="400" y="435"
        font-family="'Inter', sans-serif"
        font-weight="800"
        font-size="15"
        fill="#F5C400"
        text-anchor="middle"
        letter-spacing="6">
    SURVIVE TO WIN • PER KILL CASH REWARDS
  </text>
</svg>
