<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b081d" />
      <stop offset="50%" stop-color="#190d3d" />
      <stop offset="100%" stop-color="#070312" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#00bbf9" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield / Hexagon -->
  <rect width="500" height="500" fill="url(#bgGrad)" />
  <circle cx="250" cy="220" r="180" fill="#a855f7" opacity="0.15" filter="url(#glow)" />
  <circle cx="250" cy="220" r="130" fill="#00f5d4" opacity="0.1" filter="url(#glow)" />

  <!-- Geometric Polygonal Outer Shield -->
  <polygon points="250,30 440,110 410,380 250,470 90,380 60,110" fill="none" stroke="url(#neonPurple)" stroke-width="6" opacity="0.8" />
  <polygon points="250,50 420,120 395,365 250,445 105,365 80,120" fill="none" stroke="url(#neonCyan)" stroke-width="2" opacity="0.5" />

  <!-- Esports Lone Wolf Head -->
  <g transform="translate(0, 10)">
    <!-- Ears -->
    <!-- Left Ear -->
    <polygon points="170,140 130,40 210,110" fill="url(#neonPurple)" />
    <polygon points="170,135 145,65 195,115" fill="#4c1d95" />
    <!-- Right Ear -->
    <polygon points="330,140 370,40 290,110" fill="url(#neonPurple)" />
    <polygon points="330,135 355,65 305,115" fill="#4c1d95" />

    <!-- Forehead & Temples -->
    <polygon points="250,90 200,140 300,140" fill="#2e1065" stroke="url(#neonPurple)" stroke-width="3" />
    <polygon points="200,140 160,190 210,190" fill="#1e1b4b" />
    <polygon points="300,140 340,190 290,190" fill="#1e1b4b" />

    <!-- Cheeks / Fur Tufts -->
    <polygon points="160,190 110,230 170,240 130,270 190,265" fill="#3b0764" stroke="url(#neonPurple)" stroke-width="2" />
    <polygon points="340,190 390,230 330,240 370,270 310,265" fill="#3b0764" stroke="url(#neonPurple)" stroke-width="2" />

    <!-- Wolf Glowing Eyes (Cyan Neon) -->
    <!-- Left Eye -->
    <polygon points="190,185 225,195 200,205" fill="url(#neonCyan)" filter="url(#glow)" />
    <polygon points="195,188 220,195 205,200" fill="#ffffff" />
    <!-- Right Eye -->
    <polygon points="310,185 275,195 300,205" fill="url(#neonCyan)" filter="url(#glow)" />
    <polygon points="305,188 280,195 295,200" fill="#ffffff" />

    <!-- Snout & Bridge -->
    <polygon points="250,140 220,220 280,220" fill="#180d38" />
    <polygon points="220,220 250,290 280,220" fill="#24124d" stroke="url(#neonCyan)" stroke-width="2" />

    <!-- Nose -->
    <polygon points="250,270 235,285 265,285" fill="url(#neonPurple)" />

    <!-- Fangs / Teeth -->
    <polygon points="230,300 240,325 245,300" fill="#ffffff" filter="url(#glow)" />
    <polygon points="270,300 260,325 255,300" fill="#ffffff" filter="url(#glow)" />
    <polygon points="245,300 250,315 255,300" fill="#e0e7ff" />

    <!-- Jaw -->
    <polygon points="220,290 250,345 280,290" fill="none" stroke="url(#neonPurple)" stroke-width="4" />
  </g>

  <!-- Sniper Crosshair Headshot Icon (Gold / Red) on Forehead -->
  <g transform="translate(250, 160)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#ef4444" stroke-width="3" />
    <circle cx="0" cy="0" r="16" fill="none" stroke="#f59e0b" stroke-width="2" />
    <line x1="-38" y1="0" x2="-8" y2="0" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <line x1="8" y1="0" x2="38" y2="0" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="-38" x2="0" y2="-8" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="8" x2="0" y2="38" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>

  <!-- Esports Badge Banner: LONE WOLF -->
  <g transform="translate(0, 360)">
    <!-- Ribbon Base -->
    <polygon points="60,50 90,15 410,15 440,50 410,85 90,85" fill="#090514" stroke="url(#neonPurple)" stroke-width="4" />
    <polygon points="75,50 95,25 405,25 425,50 405,75 95,75" fill="url(#neonPurple)" opacity="0.2" />

    <!-- Text: LONE WOLF -->
    <text x="250" y="47" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="30" fill="url(#neonCyan)" text-anchor="middle" letter-spacing="4" filter="url(#glow)">
      LONE WOLF
    </text>
    <text x="250" y="47" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle" letter-spacing="4">
      LONE WOLF
    </text>

    <!-- Subtitle Banner: HEADSHOT 1V1 / 2V2 -->
    <rect x="130" y="60" width="240" height="24" rx="12" fill="#ef4444" />
    <text x="250" y="77" font-family="'Arial Black', sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      🎯 HEADSHOT ONLY
    </text>
  </g>
</svg>
